      <div id="page-liquidaciones" class="page">

        <!-- ══════════ SEMANA DE PAGO ══════════
             La semana de trabajo es VIE→JUE para todos, la misma con la que se
             factura al cliente: la condición no cambia el ciclo, dice qué DÍA se
             paga esa semana (Titular=viernes · Semi Titular=lunes · Suplente=martes).
             Antes el período era un filtro libre (Todo/Hoy/Este mes) y por eso una
             liquidación no tenía a qué semana pertenecer: no se podía dar por lista. -->
        <div class="card" style="margin-bottom:16px;padding:14px 18px">
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <span style="font-size:13px;font-weight:600;color:var(--text-secondary)"><i class="ic ic-calendar"></i> Semana de pago</span>
            <input type="date" id="liq-semana" onchange="cambiarSemanaLiq()" aria-label="Semana a liquidar">
            <span id="liq-fecha-label" style="font-size:12px;color:var(--text-muted)"></span>
            <button class="btn btn-sm" onclick="moverSemanaLiq(-1)" title="Semana anterior">‹ Anterior</button>
            <button class="btn btn-sm" onclick="moverSemanaLiq(1)" title="Semana siguiente">Siguiente ›</button>
          </div>
        </div>

        <!-- Estado del armado: lo mismo que muestra Liquidación de clientes. -->
        <div class="metrics-grid" id="liq-kpis" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px"></div>

        <div class="card">
          <div class="card-header">
            <span class="card-title">Liquidaciones por conductor</span>
            <div style="display:flex;gap:8px;align-items:center;">
              <input type="search" id="liq-search" placeholder="Buscar conductor..." style="width:180px;" oninput="renderLiquidaciones()">
              <select id="liq-filter-condicion" onchange="renderLiquidaciones()">
                <option value="">Todas las condiciones</option>
                <option value="Titular">Titular</option>
                <option value="Semi Titular">Semi Titular</option>
                <option value="Suplente">Suplente</option>
                <option value="sin_asignar">Sin condición asignada</option>
              </select>
              <span id="liq-aviso-sinarmar"></span>
              <button class="btn btn-sm" onclick="marcarTodasLiqConductor()" title="Da por listas todas las liquidaciones que estás viendo, para que el tesorero pueda descargarlas"><i class="ic ic-check"></i> Marcar todas listas</button>
              <button class="btn btn-sm" onclick="exportPlanillaPago()" title="La planilla que firma el conductor al cobrar: conductor, importe y una columna CONFORME. Sale con las liquidaciones ya marcadas como listas."><i class="ic ic-file"></i> Planilla de pago (firma)</button>
              <button class="btn btn-sm" id="liq-btn-unpdf" onclick="exportLiqCombinado()" title="Todas las liquidaciones elegidas en UN solo archivo, una por página. Útil para imprimir de una y cuando el navegador bloquea las descargas múltiples."><i class="ic ic-file"></i> En un solo PDF</button>
              <button class="btn btn-sm btn-primary" id="liq-btn-descargar" onclick="exportAllPDFs()" title="Descarga un PDF por conductor. Respeta el filtro y, si tildaste conductores, baja solo esos."><i class="ic ic-download"></i> Descargar liquidaciones (PDF)</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width:34px"><input type="checkbox" id="liq-check-all" onchange="toggleLiqSelTodos(this.checked)" title="Seleccionar / desmarcar todas las del filtro"></th>
                  <th>Conductor</th>
                  <th>Categoría</th>
                  <th title="Días distintos con envíos entregados en el período">Días trab.</th>
                  <th>Recorridos</th>
                  <th>Sin Colecta</th>
                  <th>Con Colecta</th>
                  <th>SLA</th>
                  <th>Super SLA</th>
                  <th>Estado</th>
              <th title="Lo que se le paga: bruto + adicionales − descuentos imputados en el período">Total a pagar</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="liq-table-body">
                <tr><td colspan="11"><div class="empty-state"><div class="empty-icon"><i class="ic ic-dollar"></i></div><div class="empty-title">Sin liquidaciones</div><div class="empty-sub">Importá una base de datos primero</div></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
