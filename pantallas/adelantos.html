      <div id="page-adelantos" class="page">

        <div class="section-head" style="margin-bottom:8px">
          <span class="section-title"><i class="ic ic-card"></i> Adelantos</span>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <!-- Esto NO es un filtro de lo que se ve —eso lo decide el mes, más
                 abajo—: es la fecha A LA QUE SE IMPUTA la cuota que se descuente,
                 y por eso vive pegada a los dos botones que la usan. Una cuota va
                 en UNA sola liquidación y la decide su fecha, así que esto tiene
                 que seguir siendo un día y no un mes. -->
            <div class="date-range" title="Fecha a la que se imputan las cuotas que descuentes. No filtra la tabla.">
              <i class="ic ic-calendar"></i>
              <span class="date-label" id="adelantos-fecha-label">Imputar a la semana</span>
              <input type="date" id="adelantos-fecha" aria-label="Fecha de imputación de las cuotas">
            </div>
            <button class="btn btn-sm" onclick="descontarCuotaSemanal()" title="Descuenta una cuota a TODOS los adelantos activos del grupo, estén o no en el mes que estás viendo"><i class="ic ic-chevrons-down"></i> Descontar cuota semanal (todos)</button>
            <label class="btn btn-sm" style="cursor:pointer;margin:0"><i class="ic ic-folder"></i> Importar Excel
              <input type="file" id="adelantos-file-input" accept=".xlsx,.xls,.csv" onchange="importAdelantos(event)" style="display:none">
            </label>
            <button class="btn btn-sm" onclick="descargarPlantillaAdelantos()"><i class="ic ic-download"></i> Plantilla Excel</button>
            <button class="btn btn-sm btn-primary" onclick="openAddAdelantoModal()">+ Nuevo adelanto</button>
          </div>
        </div>

        <!-- Cada grupo tiene su propio panel: los adelantos a conductores se
             cobran en la liquidación semanal; los de empleados, en el sueldo. -->
        <div class="tabs" id="adelantos-tabs" style="margin-bottom:14px">
          <button class="tab active" id="adel-btn-conductor" onclick="switchAdelantoTab('conductor')"><i class="ic ic-users"></i> Conductores <span id="adel-count-conductor"></span></button>
          <button class="tab" id="adel-btn-empleado" onclick="switchAdelantoTab('empleado')"><i class="ic ic-user"></i> Empleados <span id="adel-count-empleado"></span></button>
        </div>

        <div class="alert alert-info" style="margin-bottom:16px" id="adelantos-ayuda"></div>

        <!-- El mes que se está mirando, el mismo navegador del resto de
             Imputaciones. Acota la tabla y contesta "cuánto se prestó en
             octubre": sin él, "Total prestado" mezcla préstamos de todos los
             meses y no se puede separar lo que se dio ahora de la deuda que se
             viene arrastrando. Arranca en el corriente, con "Todos" al lado. -->
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
          <span style="font-size:13px;font-weight:600;color:var(--text-secondary)"><i class="ic ic-calendar"></i> Mes</span>
          <div class="date-range" id="adelantos-mes-nav">
            <button class="btn btn-sm" onclick="panelMoverMes('adelantos',-1)" title="Mes anterior" aria-label="Mes anterior">‹</button>
            <input type="month" id="adelantos-mes" onchange="panelElegirMes('adelantos',this.value)" aria-label="Mes a ver">
            <button class="btn btn-sm" onclick="panelMoverMes('adelantos',1)" title="Mes siguiente" aria-label="Mes siguiente">›</button>
          </div>
          <button class="btn btn-sm panel-mes-btn" id="adelantos-mes-todos" onclick="panelTodosLosMeses('adelantos')" title="Ver los adelantos de todos los meses">Todos</button>
        </div>

        <!-- Resumen: lo prestado en el mes (flujo) y la deuda vigente (saldo) -->
        <div id="adelantos-resumen"></div>

        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
          <input type="search" id="adelantos-search" placeholder="🔍 Buscar..." style="width:280px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px" oninput="renderAdelantos()">
          <span id="adelantos-count" style="font-size:12px;color:var(--text-muted)"></span>
        </div>

        <div class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th id="adelantos-col-benef">Conductor</th>
                  <th><i class="ic ic-calendar"></i> Fecha</th>
                  <th style="text-align:right">Monto total</th>
                  <th style="text-align:right">Cuota</th>
                  <th>Progreso</th>
                  <th style="text-align:right">Saldo</th>
                  <th style="width:130px">Acciones</th>
                </tr>
              </thead>
              <tbody id="adelantos-rows">
                <tr><td colspan="7"><div class="empty-state"><div class="empty-icon"><i class="ic ic-card"></i></div><div class="empty-title">Sin adelantos</div><div class="empty-sub">Registrá uno con "+ Nuevo adelanto"</div></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
